<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo_coditech/ctcompletoico/favicon.ico">
    <title>Cadastro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-300">
    <header class="p-2 pb-[15px] text-white font-sans font-bold text-3xl bg-[linear-gradient(45deg,#082031,#0b2e47,#cabcbcb7)]">
        <div class="flex justify-between items-center">
            <h1 class="flex items-center gap-5">
                <img src="logo_coditech/ctcompletopng/5-80.png" alt="Logo Coditech">
                PONTO CODITECH
            </h1>
            <nav>
                <a class="text-xl text-black hover:bg-[#f2800d] hover:text-white rounded-[6px] font-medium p-2 pb-[8px] text-[17px]" href="login.html">LOGIN</a>
                <a class="text-xl text-black hover:bg-[#f2800d] hover:text-white rounded-[6px] font-medium p-2 pb-[8px] text-[17px]" href="cadastro.html">CADASTRO</a>
            </nav>
        </div>
    </header>

    <main class="flex items-center h-[80vh] justify-center">
        <div class="flex flex-col gap-4 bg-[#082031] rounded-[15px] w-[500px] text-white p-4 shadow-[0px_3px_10px_black]">

            <h2 class="text-center text-[25px]">CADASTRO</h2>

            <div class="gap-3 flex justify-between">

                <div class="flex flex-col gap-2">

                    <div class="flex flex-col gap-1">
                        <label for="nome">Nome</label>
                        <input class="p-1 bg-white rounded-[5px] text-black" id="nome" type="text" placeholder="Nome completo" aria-label="Digite seu nome completo">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="CPF">CPF</label>
                        <input class="p-1 bg-white rounded-[5px] text-black" t id="CPF" type="text" placeholder="000.000.000-00" aria-label="Digite seu CPF">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="RG">RG</label>
                      <input class="bg-white p-1 rounded-[5px] text-black" id="RG" type="text" placeholder="0000000" aria-label="Digite seu RG">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="telefone">Telefone</label>
                        <input class="p-1 bg-white rounded-[5px] text-black" id="telefone" type="text" placeholder="(00) 00000-0000" aria-label="Digite seu numero de telefone">
                    </div>
                </div>
                <div class="flex flex-col gap-2">
                    <div class="flex flex-col gap-1">
                        <label for="logradouro">Logradouro</label>
                        <input class="p-1 bg-white rounded-[5px] text-black" id="logradouro" type="text" placeholder="Ex: (Rua, Avenida, etc)" aria-label="Digite o logradouro">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="bairro">Bairro</label>
                        <input class="p-1 bg-white rounded-[5px] text-black" t id="bairro" type="text" placeholder="Nome do Bairro" aria-label="Digite o nome do seu bairro">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="numero">Número</label>
                        <input class="p-1 bg-white rounded-[5px] text-black"  id="numero" type="text" placeholder="Número da moradia" aria-label="Digite o número da sua moradia">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="senha">Senha</label>
                        <input class="p-1 bg-white rounded-[5px] text-black" id="senha" type="password" placeholder="Escolha uma Senha" aria-label="Escolha sua senha">
                    </div>
                </div>
            </div>
            <label for="cargo" class="text-xl">Cargo</label>
            <div class="flex flex-col gap-2">
                    <div class="flex flex-col bg-white text-black rounded-[8px] p-[5px]">
                        <select id="cargo">
                            <option class="bg-white" value="">Selecione seu Cargo</option>
                            <option class="bg-white" value="1">Front-End</option>
                            <option class="bg-white" value="2">Back-End</option>
                            <option class="bg-white" value="3">UX/UI</option>
                            <option class="bg-white" value="4">PO</option>
                        </select>
                    </div>
                </div>
            <div class="flex justify-center mt-4">
                <button class="bg-[#f2800d] hover:bg-[#d96d00] text-white font-bold py-4 px-4 rounded-[28px] w-[200px]">
                    CADASTRAR
                </button>
            </div>

            <h3 class="mt-2 text-center text-sm text-red-500">Seu ID será gerado automaticamente</h3>
            <!-- Aqui vai o ID gerado automaticamente -->
        </div>
    </main>
</body>
</html>
