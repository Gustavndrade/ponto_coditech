<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="logo_coditech/ctcompletoico/favicon.ico" />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#082031] text-white font-sans min-h-screen">

    <header>
        <nav class="flex flex-col md:flex-row items-center justify-between px-6 py-4 bg-[#0b2e47] shadow-md">
            <div class="flex items-center gap-4 text-2xl font-bold">
                <img src="logo_coditech/ctcompletopng/5-80.png" alt="Logo Coditech" class="h-10 w-auto" />
                <span>PONTO CODITECH</span>
            </div>
            <div class="flex gap-4 mt-3 md:mt-0">
                <a href="index.html" class="hover:opacity-80 transition px-3 py-2 rounded-md bg-[#145374]">INÍCIO</a>
                <a href="cadastro.html"
                    class="hover:opacity-80 transition px-3 py-2 rounded-md bg-[#145374]">CADASTRO</a>
            </div>
        </nav>
    </header>

    <main class="flex justify-center px-4 py-10">
        <div class="w-full max-w-6xl bg-white rounded-xl shadow-md p-6 text-black">

            <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8 text-center font-bold uppercase">
                <div class="bg-slate-300 p-6 rounded-lg shadow">Total de Funcionários</div>
                <div class="bg-slate-300 p-6 rounded-lg shadow">Funcionários Online</div>
                <div class="bg-slate-300 p-6 rounded-lg shadow">Funcionários Offline</div>
            </section>


            <section class="overflow-x-auto">
                <table class="min-w-full bg-slate-300 rounded-lg overflow-hidden text-left">
                    <thead class="bg-slate-400 text-gray-800">
                        <tr>
                            <th class="px-4 py-3">Funcionário</th>
                            <th class="px-4 py-3">Data</th>
                            <th class="px-4 py-3">Status</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-900">
                        <tr class="border-t border-gray-400">
                            <td class="px-4 py-3">Glauber</td>
                            <td class="px-4 py-3">06/06/2025</td>
                            <td class="px-4 py-3">Online</td>
                        </tr>
                        <tr class="border-t border-gray-400">
                            <td class="px-4 py-3">Hommer</td>
                            <td class="px-4 py-3">06/06/2025</td>
                            <td class="px-4 py-3">Offline</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>

</body>

</html>
