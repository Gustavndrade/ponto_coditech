<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo_coditech/ctcompletoico/favicon.ico">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {}
      }
    }
    </script>
</head>
<body>
    <header class="p-2 pb-[15px] mb-10 relative z-10 text-white font-sans font-bold text-3xl bg-[#0b2e47]">
    <div>
      <h1 class="flex items-center gap-5">
        <img src="logo_coditech/ctcompletopng/5-80.png" alt="Logo Coditech" />
        PONTO CODITECH
      </h1>
    </div>
  </header>
    <!-- bagulho que fica na lateral
    <aside class="bg-[#082031] w-60">
        <h2>INÍCIO</h2>
        <h3>Bater Ponto</h3>
        <h3>Histórico Pessoal</h3>
    </aside> -->
   <main class="p-4">  
        <section class="flex flex-col md:flex-row justify-center gap-10">
            <div class="p-4 md:px-20 shadow rounded-lg bg-slate-300">
                <h2>total de funcionarios</h2>
            </div>
            <div class="p-4 md:px-20 shadow rounded-lg bg-slate-300">
                <h2>funcionarios online <!--funcionarios com ponto aberto--> </h2>
            </div>
            <div class="p-4 md:px-20 shadow rounded-lg bg-slate-300">
                <h2>funcionarios offline <!--funcionarios com ponto fechado--></h2>
            </div>
        </section>

        <section class="rounded-md overflow-hidden">
            <table class="w-full mt-3 text-left rounded-md overflow-hidden">
                <thead class="bg-slate-300">
                    <tr>
                        <th class="pb-4 p-1">Funcionário</th>
                        <th class="pb-4 p-1">Data</th>
                        <th class="pb-4 p-1">Status</th>
                    </tr>
                </thead>
                <tbody class="bg-slate-200">
                    <tr>
                        <td class="p-1">Glauber</td>
                        <td class="p-1">06/06/2025</td>
                        <td class="p-1">Online</td>
                    </tr>
                    <tr>
                        <td class="p-1">Hommer</td>
                        <td class="p-1">06/06/2025</td>
                        <td class="p-1">Offline</td>
                    </tr>
                    
                </tbody>
            </table>
        </section>
   </main>
</body>
</html>
