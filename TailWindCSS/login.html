<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="logo_coditech/ctcompletoico/favicon.ico" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {}
      }
    }
  </script>
</head>
<body class="md:bg-[#082031]">
  <header class="p-2 pb-[15px] text-white font-sans relative z-10 font-bold text-3xl bg-[#0b2e47]">
    <div class="flex justify-between items-center flex-wrap gap-4">
      <h1 class="flex items-center gap-5">
        <img src="logo_coditech/ctcompletopng/5-80.png" alt="Logo Coditech" />
        PONTO CODITECH
      </h1>
    </div>
  </header>

  <main class="flex justify-center items-center h-[80vh] px-4">
    <div class="flex flex-col gap-10 bg-white px-8 py-12 rounded-[15px] w-full max-w-md md:shadow-xl">
      <h2 class="text-[#f2800d] text-center text-4xl font-bold">BATER PONTO</h2>
      <div class="flex flex-col gap-3">
        <select name="Seletor" id="Seletor" class="p-3 bg-slate-300 rounded-lg">
          <option value="1">Robbert</option>
          <option value="2">Samuel</option>
          <option value="3">Pedro</option>
          <option value="4">rancor</option>
        </select>
        <input class="bg-slate-300 rounded-[8px] p-3" type="password" placeholder="Senha" />
      </div>
      <div class="flex flex-col sm:flex-row gap-4">
        <button class="hover:bg-red-600 bg-red-500 text-white font-bold p-3 transition-all duration-300 border-2 hover:border-red-400 rounded-md w-full">
          &#x1F1FD SAÍDA
        </button>
        <button class="hover:bg-green-600 bg-green-500 text-white font-bold p-3 transition-all duration-300 border-2 hover:border-green-400 rounded-md w-full">
          &#x1F5F8 ENTRADA
        </button>
      </div>
      <div class="text-center pt-2">
        <h3 class="text-sm font-semibold">Não tem uma conta?
          <a href="cadastro.html" class="hover:text-[#f2800d] underline text-[#d96d00] font-bold">Painel Administrativo</a>
        </h3>
      </div>
    </div>
  </main>
</body>
</html>
