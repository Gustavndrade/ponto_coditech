<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo_coditech/ctcompletoico/favicon.ico">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#082031]">
<header class="p-2 pb-[15px] text-white font-sans font-bold text-3xl bg-[linear-gradient(45deg,#082031,#0b2e47,#cabcbcb7)]">
        <div class="flex justify-between items-center">
            <h1 class="flex items-center gap-5">
                <img src="logo_coditech/ctcompletopng/5-80.png" alt="Logo Coditech">
                PONTO CODITECH
            </h1>
            <!--
            <nav>
                <a class="text-xl text-black hover:bg-[#f2800d] hover:text-white rounded-[6px] font-normal p-2 pb-[8px]" href="login.html">login</a>
                <a class="text-xl text-black hover:bg-[#f2800d] hover:text-white rounded-[6px] font-normal p-2 pb-[8px]" href="cadastro.html">cadastro</a>
            </nav>
        -->
        <div class="flex justify-center h-[15vh] items-center p-2 text-[#d96d00] text-5xl font-semibold text-shadow-[1px_1px_0px_black]" id="relogio">
            00:00:00
        </div>
        </div>
    </header>


    <main class="flex justify-center items-center h-[70vh] font-medium">
            <div class="flex flex-col gap-10 bg-white p-4 rounded-[15px] w-[500px] shadow-[0px_3px_25px_black]">
                <h2 class="text-[#f2800d] text-center text-4xl font-bold">BATER PONTO</h2>
                <div class="flex flex-col bg-slate-300 rounded-[8px]">
                    <select name="Seletor" id="Seletor" class="p-3">
                        <option value="1">Robbert</option>
                        <option value="2">Samuel</option>
                        <option value="3">Pedro</option>
                        <option value="4">rancor</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <input class="bg-slate-300 rounded-[8px] p-3" type="password" placeholder="Senha" aria-label="Insira sua senha">
                </div>
                <div class="flex flex- justify-center mt-4 gap-2">
                    <button class="hover:bg-[#d96d00] bg-[#f2800d] text-white font-bold p-3 rounded-md w-full">  <h3>&#x1F5F8</h3> ENTRADA</button>
                    
                    <button class="hover:bg-[#d96d00] bg-[#f2800d]  text-white font-bold p-3 rounded-md w-full"> <h3>&#x1F1FD</h3> SAÍDA</button>
                </div>
                <div class="flex items-center justify-center pt-4">
                    <h3 class="text-sm text-center font-semibold">Não tem uma conta? <a href="cadastro.html" class="hover:text-[#f2800d] underline text-[#d96d00] font-bold">Painel Administrativo</a></h3> 
                </div>
            </main>

            <script>
                function relogio(){
                const agora = new Date();
                var horas = agora.getHours().toString().padStart(2, '0');
                var minutos = agora.getMinutes().toString().padStart(2,'0');
                var segundos = agora.getSeconds().toString().padStart(2,'0');
                
            document.getElementById('relogio').textContent = `${horas}:${minutos}:${segundos}`;

        }
        setInterval(relogio, 1000);
        relogio();
            </script>
</body>
</html>
