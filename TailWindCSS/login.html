<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo_coditech/ctcompletoico/favicon.ico">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-300">
<header class="p-2 pb-[15px] text-white font-sans font-bold text-3xl bg-[linear-gradient(45deg,#082031,#0b2e47,#cabcbcb7)]">
        <div class="flex justify-between items-center">
            <h1 class="flex items-center gap-5">
                <img src="logo_coditech/ctcompletopng/5-80.png" alt="Logo Coditech">
                PONTO CODITECH
            </h1>
            <nav>
                <a class="text-xl text-black hover:bg-[#f2800d] hover:text-white rounded-[6px] font-normal p-2 pb-[8px]" href="login.html">login</a>
                <a class="text-xl text-black hover:bg-[#f2800d] hover:text-white rounded-[6px] font-normal p-2 pb-[8px]" href="cadastro.html">cadastro</a>
            </nav>
        </div>
    </header>

    <main class="flex justify-center items-center h-[80vh] font-medium">
            <div class="flex flex-col gap-10 bg-[#082031] p-4 rounded-[15px] w-[500px] shadow-[0px_3px_25px_black]">
                <h2 class="text-white text-center text-[30px]">LOGIN</h2>
                <div class="flex flex-col">
                    <input class="bg-white rounded-[8px] p-3" type="text" placeholder="CPF" aria-label="Insira seu CPF">
                </div>
                <div class="flex flex-col">
                    <input class="bg-white rounded-[8px] p-3" type="text" placeholder="Senha" aria-label="Insira sua senha">
                </div>
                <div class="flex justify-center mt-4">
                    <button class="bg-[#f2800d] hover:bg-[#d96d00] text-white font-bold py-4 px-4 rounded-[28px] w-[200px]">
                    CADASTRAR
                    </button>
                </div>
                <h3 class="text-white text-sm text-center">Não tem uma conta? <a href="cadastro.html" class="hover:text-blue-300 hover:underline">clique aqui.</a></h3>
            </div>
    </main>
   
</body>
</html>
